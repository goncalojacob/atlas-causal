# On every pull request: schemas, rules, tests. Never touches data/index/ —
# freshness is asserted on main by deploy.yml, so two open PRs cannot
# conflict on the index.
name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate records
        run: node tools/validate.mjs
      - name: Tests
        run: node --test
