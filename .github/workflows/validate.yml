# On every pull request: schemas, rules, tests. It never builds or commits
# data/index/ — that is deploy.yml's on main, so two open pull requests cannot
# conflict on the index.
#
# What it does do, when the pull request itself touches `data/index/`, is
# check that what was committed there is what those records build. Until
# 6 September it asked that of any branch that touched `data/` at all, which
# made every contribution the form opened fail the gate: the branch carried
# the new records and the base branch's `sources.html`, and rule 16 covers
# the prerendered pages too (health review of 6 September, R2 and R12). A
# branch that adds records and no index is not stale — it is a branch that
# left the generated files to the branch that owns them.
name: validate

on:
  # Lane branches (m68, m69, ...) carry no pull request while they run, and a
  # run that waits for its check needs one to exist: every lane push is
  # checked. The pattern is a digit after the m on purpose: `m*` also matched
  # `main`, so from 21 September every merge ran this job beside deploy.yml,
  # which runs the same tests and is the check that publishes; the extra job
  # went red on three different browser suites in three runs while deploy
  # went green on the same tree, and main showed a red mark for a job it
  # never needed.
  #
  # **And a non-zero digit, since M88 §3** (review B finding 3). `m[0-9]*`
  # matched `m0` as well, and `m0` is the branch every landing pushes before
  # opening the pull request to `main` from it — so the whole suite ran twice
  # on one tree, once for that push and once for the pull request, which is
  # the check the landing actually waits for. Six or seven minutes of a shared
  # runner per landing, several landings a day, for an answer already being
  # computed beside it. Every lane branch is `m1`, `m42`, `m42b`, `m88`; the
  # one that is not is `m0`, and its check is its pull request's.
  push:
    branches: ['m[1-9]*']
  pull_request:
  workflow_dispatch:

# A push that supersedes another on the same pull request cancels the run it
# supersedes: the health cycle pushed 168 commits in a day and paid for a
# check on every one of them.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base of the pull request has to be here to diff against it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: What this runner has
        # Four lines at the head of every log, because the load measurement of
        # M63 (docs/m63-load.md) turns on how many cores this machine has: the
        # test runner's own default concurrency is derived from that number,
        # and the browser suites were failing for want of a core rather than
        # for anything they assert. Measured here rather than assumed, so the
        # next person reading a red check can see what it ran on.
        run: |
          nproc
          free -m
          node -e 'console.log("availableParallelism", require("node:os").availableParallelism())'
      - name: Validate records
        run: node tools/validate.mjs
      - name: Tests
        # --test-timeout, as import-wikidata.yml has run it since deviation
        # 445: a test that hangs is not a test that fails. Without it a hung
        # run sits here until the job's limit, publishes no log, and says
        # nothing at all about which test it stopped in — runs 567 and 569 sat
        # 37 and 39 minutes (deviation 551). **This turns a hang into a red
        # check rather than a green one**, which is the owner's to overrule;
        # the bounds in tests/browser.mjs are what should make it never fire.
        # The slowest single test takes about 6s, so 120s is not a deadline an
        # honest test comes near.
        #
        # Two passes since M63, and the reason is docs/m63-load.md: at the
        # default concurrency three of the suites that drive a headless
        # Chromium are scheduled together on four cores, and a page that is
        # still fetching when its `waitFor` runs out drops a different test
        # every run. The eighteen that start a browser therefore run one at a
        # time and the other 129 stay parallel — 244s against the 189s of the
        # red arrangement and the 379s of serialising everything. Both passes
        # are run whatever the first one does, because a browser failure and a
        # regression in the records are different news and the log should
        # carry both; the step fails if either did.
        # tools/suites.mjs reads which files are which rather than holding a
        # list, and refuses to hand over an empty pass — `node --test` with no
        # files goes back to discovering them all, which would look green and
        # be this same check again.
        run: |
          set -u
          status=0
          node --test --test-timeout=120000 $(node tools/suites.mjs --pure) || status=1
          node --test --test-timeout=120000 --test-concurrency=1 $(node tools/suites.mjs --browser) || status=1
          # The machine, said again at the end. Only the tail of a job's log can
          # be fetched from the sandbox these runs are driven from (deviation
          # 729), and the step above prints thousands of lines, so the four
          # lines at the head of the job are out of reach exactly when a red
          # check is being read. The suite says its failing tests twice for the
          # same reason.
          echo "this ran on $(nproc) cores, $(awk '/MemTotal/ {printf "%.1f GB", $2 / 1048576}' /proc/meminfo)"
          exit $status
      - name: Whether this pull request touches data/index/
        id: data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          touched=false
          if [ -n "$BASE_SHA" ] && [ -n "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- data/index/)" ]; then
            touched=true
          fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
      - name: The index committed here is the one those records build
        if: steps.data.outputs.touched == 'true'
        run: node tools/validate.mjs --index
