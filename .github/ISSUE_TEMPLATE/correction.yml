# Same shape as contribution.yml, and the same pipeline: the difference is
# the `correction` label, which lets tools/bundle-to-files.mjs overwrite the
# records that already exist. A correction is a whole replacement record with
# the id it already has — never a diff, never a partial object — because the
# contribution format is the storage format (principle 5).
name: Correction — replace records that are already in the atlas
description: A date, an argument, a confidence level or a source that is wrong.
title: "Correction: "
labels: ["contribution", "correction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when a record already in the atlas is wrong. **Edit this record**, on the record's
        own card and at the top of its entry page, opens the contribution form on its fields: change
        the one that is wrong and the form produces the bundle below. Doing it by hand works too —
        load `data/<kind>s/<id>.json`, change what is wrong, and paste the **whole record**.

        Either way the `id` stays as it is: a correction that changes the id creates a second record
        for the same thing, which is the one mistake nothing downstream can undo. The bundle is the
        whole record and not a list of changed fields, because the contribution format is the
        storage format (principle 5) — what changes is one field, what travels is the record.

        A wrong record is never deleted. If the record should not exist at all, say so in the notes
        and leave the fix to the reviewer: the record becomes a tombstone that still resolves old
        links, rather than a hole in everyone's bookmarks. You do not have to work out what else
        would have to go with it — a retraction accepted here carries the links into and out of the
        record, and the walks through them, and says so on the pull request.
  - type: textarea
    id: bundle
    attributes:
      label: The bundle
      description: A bundle whose records carry ids that already exist. Paste it whole, fenced or not.
      placeholder: '{ "schema": 1, "records": [ … ] }'
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What is wrong, and how you know
      description: Which source says otherwise, and where in it.
    validations:
      required: true
  - type: checkboxes
    id: grant
    attributes:
      label: Licence and authorship
      options:
        - label: I publish this correction under CC BY-SA 4.0, and I understand that the grant cannot be withdrawn once others build on it.
          required: true
        - label: Every word I have written here is my own. None of it was generated by a language model.
          required: true
        - label: The sources exist, I have consulted them, and they support the correction.
          required: true
