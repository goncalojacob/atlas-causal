# One issue is one bundle: an event, the edges that connect it and any source
# not yet in the bibliography travel together and are validated as a unit
# (docs/review-2026-09-01.md, finding 6). The bundle textarea is deliberately
# not `render:`-ed — the form prefills this field through the URL when it
# fits, and a rendered textarea is the one thing prefill cannot be trusted
# with. tools/bundle-to-files.mjs reads either a fenced block or the raw text.
name: Contribution — a bundle of records
description: Events, edges and sources built by the contribution form.
title: "Contribution: "
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Build the bundle with **contribute.html** rather than by hand: it validates what you
        write against the records already in the atlas, so what arrives here already resolves
        its references and passes the arrow of time.

        Applying the `contribution` label to this issue does nothing on its own. A maintainer
        reads it, and only the `accepted` label — which only a maintainer can apply — turns it
        into a pull request. That pull request is then reviewed by a person before anything is
        merged. No sources, no merge.
  - type: textarea
    id: bundle
    attributes:
      label: The bundle
      description: The JSON the form copied to your clipboard. Paste it whole, fenced or not.
      placeholder: '{ "schema": 1, "records": [ … ] }'
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything the reviewer should know
      description: Optional. Why this edge and not another, which source settled a date, what you are unsure about.
    validations:
      required: false
  - type: checkboxes
    id: grant
    attributes:
      label: Licence and authorship
      options:
        - label: I publish this contribution under CC BY-SA 4.0, and I understand that the grant cannot be withdrawn once others build on it.
          required: true
        - label: Every word of the summary, the explanation and the dispute is my own. None of it was generated by a language model.
          required: true
        - label: The sources exist, I have consulted them, and they support the claim I am making.
          required: true
